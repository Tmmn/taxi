    "ineqpy>=0.4.1",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3",
    "pyspark>=4.1.0",
    "scipy>=1.16.3",
    "scipy-stubs>=1.17.0.0",
    "seaborn>=0.13.2",
]
