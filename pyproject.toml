    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pandas-stubs>=3.0.2",
    "pip==24.3.1",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.3",
    "seaborn>=0.13.2",
]
